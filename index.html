<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Oracle</title>
<style>
  :root {
    --ink: #0c0e0d;
    --ink-2: #14100a;
    --obsidian: #070806;
    --brass: #c8a24a;
    --brass-soft: #e6c880;
    --glow: #8fe6d4;
    --parchment: #efe7d2;
    --muted: #97907c;
    --line: #2a271d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    background:
      radial-gradient(120% 90% at 50% 8%, #1a1610 0%, var(--ink) 42%, var(--obsidian) 100%);
    color: var(--parchment);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    overflow-x: hidden;
    position: relative;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .eyebrow {
    z-index: 1;
    text-transform: uppercase;
    letter-spacing: 0.42em;
    font-size: 0.68rem;
    color: var(--brass);
    margin: 0 0 14px;
    padding-left: 0.42em;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  h1 {
    z-index: 1;
    font-size: clamp(2.4rem, 8vw, 4rem);
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.01em;
    margin: 0 0 10px;
    text-align: center;
    text-wrap: balance;
    color: var(--parchment);
  }
  .subtitle {
    z-index: 1;
    color: var(--muted);
    font-size: 0.98rem;
    margin: 0 0 42px;
    text-align: center;
    max-width: 34ch;
    line-height: 1.5;
    text-wrap: balance;
  }

  .orb-wrap {
    z-index: 1;
    position: relative;
    margin-bottom: 44px;
    display: grid;
    place-items: center;
  }
  /* brass ring around the orb */
  .ring {
    position: absolute;
    width: clamp(230px, 62vw, 340px);
    height: clamp(230px, 62vw, 340px);
    border-radius: 50%;
    border: 1px solid var(--line);
    box-shadow: inset 0 0 0 1px #00000060;
  }
  .ring::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1px dashed #4a4028;
    opacity: 0.5;
  }
  .orb {
    width: clamp(200px, 54vw, 296px);
    height: clamp(200px, 54vw, 296px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 36% 30%, #ffffff22 0%, #1c2a2733 26%, #0b1512 62%, #050807 100%);
    box-shadow:
      0 0 70px #8fe6d433,
      inset 0 2px 34px #ffffff14,
      inset 0 -20px 60px #000000cc;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 22px;
    position: relative;
    animation: float 7s ease-in-out infinite;
    transition: transform 0.4s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .orb.thinking { animation: pulse 0.75s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 70px #8fe6d433, inset 0 2px 34px #ffffff14, inset 0 -20px 60px #000000cc; }
    50%      { box-shadow: 0 0 120px #8fe6d4aa, inset 0 2px 34px #ffffff22, inset 0 -20px 60px #000000cc; }
  }
  .answer {
    font-size: clamp(1.6rem, 7vw, 2.8rem);
    font-style: italic;
    letter-spacing: 0.01em;
    word-break: break-word;
    color: #f4fffb;
    text-shadow: 0 0 22px var(--glow);
    min-height: 1.2em;
    line-height: 1.1;
  }
  .answer.placeholder {
    font-size: 1rem;
    font-style: normal;
    color: var(--muted);
    text-shadow: none;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .controls {
    z-index: 1;
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 480px;
    flex-wrap: wrap;
    justify-content: center;
  }
  input {
    flex: 1 1 250px;
    padding: 15px 20px;
    font-size: 1rem;
    font-family: inherit;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: #0000004d;
    color: var(--parchment);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input::placeholder { color: #6f6a58; font-style: italic; }
  input:focus { border-color: var(--brass); box-shadow: 0 0 0 1px #c8a24a55; }
  button {
    padding: 15px 30px;
    font-size: 0.78rem;
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    border-radius: 2px;
    border: 1px solid var(--brass);
    cursor: pointer;
    background: transparent;
    color: var(--brass-soft);
    transition: background 0.2s ease, color 0.2s ease, transform 0.12s ease;
  }
  button:hover { background: var(--brass); color: var(--ink); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; background: transparent; color: var(--brass-soft); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

  .hint {
    z-index: 1;
    margin: 26px 0 0;
    color: var(--muted);
    font-size: 0.8rem;
    font-style: italic;
    text-align: center;
  }
</style>
</head>
<body>
  <canvas class="stars"></canvas>

  <p class="eyebrow">Divination &nbsp;·&nbsp; One Word</p>
  <h1>The Oracle</h1>
  <p class="subtitle">Ask any question and receive a single word. It could be anything — the meaning is yours to draw out.</p>

  <div class="orb-wrap">
    <div class="ring"></div>
    <div class="orb" id="orb">
      <div class="answer placeholder" id="answer">Awaiting</div>
    </div>
  </div>

  <div class="controls">
    <input id="question" type="text" placeholder="Ask the Oracle a question…" autocomplete="off" aria-label="Your question for the Oracle" />
    <button id="ask">Consult</button>
  </div>

  <p class="hint">The Oracle speaks in one word — it could be any word at all.</p>

<script>
const WORDS = [
  "yes","no","maybe","soon","never","always","perhaps","wait","go","stop","return","begin",
  "moon","river","fire","ember","storm","tide","dawn","dusk","frost","echo","shadow","light",
  "stone","feather","thread","mirror","door","key","bridge","road","compass","anchor","lantern","seed",
  "patience","courage","doubt","hope","fear","joy","sorrow","wonder","silence","chaos","balance","chance",
  "forward","backward","inward","upward","elsewhere","home","away","beyond","within","between","beneath","above",
  "listen","release","hold","seek","rest","move","trust","choose","forgive","remember","forget","yield",
  "raven","fox","whale","moth","serpent","owl","wolf","bee","spider","crane","lynx","hare",
  "gold","salt","iron","glass","ash","clay","amber","jade","copper","velvet","paper","smoke",
  "north","south","east","west","zenith","abyss","horizon","threshold","crossroads","summit","hollow","meadow",
  "rain","snow","thunder","wind","sun","star","comet","eclipse","aurora","mist","cloud","rainbow",
  "truth","lie","secret","riddle","promise","question","answer","mystery","omen","sign","fate","luck",
  "clockwork","spiral","circle","fracture","knot","weave","current","spark","pulse","drift","bloom","wither",
  "seven","thirteen","zero","infinity","half","double","none","all","one","many","few","enough",
  "whisper","shout","hum","laugh","sigh","dream","wake","sleep","breathe","wander","arrive","depart",
  "salted","golden","hidden","open","broken","whole","ancient","new","distant","near","empty","full",
  "phoenix","dragon","kraken","griffin","sphinx","chimera","basilisk","leviathan","hydra","cerberus","pegasus","unicorn",
  "coffee","umbrella","clock","candle","letter","garden","window","staircase","harbor","tunnel","attic","hearth",
  "brave","kind","clever","patient","bold","gentle","wild","quiet","fierce","calm","restless","free"
];

const answerEl = document.getElementById("answer");
const orb = document.getElementById("orb");
const input = document.getElementById("question");
const askBtn = document.getElementById("ask");

function randomWord() {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return WORDS[arr[0] % WORDS.length];
}

let busy = false;
function consult() {
  if (busy) return;
  const q = input.value.trim();
  if (!q) {
    input.focus();
    input.placeholder = "First, ask a question…";
    return;
  }
  busy = true;
  askBtn.disabled = true;
  orb.classList.add("thinking");
  answerEl.classList.remove("placeholder");

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) {
    answerEl.textContent = randomWord();
    orb.classList.remove("thinking");
    busy = false;
    askBtn.disabled = false;
    return;
  }

  let ticks = 0;
  const totalTicks = 13;
  const interval = setInterval(() => {
    answerEl.textContent = randomWord();
    ticks++;
    if (ticks >= totalTicks) {
      clearInterval(interval);
      answerEl.textContent = randomWord();
      orb.classList.remove("thinking");
      orb.style.transform = "scale(1.05)";
      setTimeout(() => (orb.style.transform = ""), 320);
      busy = false;
      askBtn.disabled = false;
    }
  }, 80);
}

askBtn.addEventListener("click", consult);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") consult(); });
input.focus();

// Twinkling starfield
const canvas = document.querySelector(".stars");
const ctx = canvas.getContext("2d");
let stars = [];
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const count = Math.min(110, Math.floor((canvas.width * canvas.height) / 14000));
  stars = Array.from({ length: count }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.3 + 0.2,
    a: Math.random() * Math.PI * 2,
    s: Math.random() * 0.02 + 0.004
  }));
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const st of stars) {
    st.a += st.s;
    const alpha = 0.25 + 0.55 * Math.abs(Math.sin(st.a));
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(230, 200, 128, " + alpha + ")";
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
window.addEventListener("resize", resize);
resize();
draw();
</script>
</body>
</html>
